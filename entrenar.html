<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050505" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/icon-512.svg" />
  <title>Quiero entrenar 🐧</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #050505;
      --ink: #f5f2ea;
      --dim: rgba(245, 242, 234, 0.55);
      --faint: rgba(245, 242, 234, 0.22);
      --gold: #e3c07a;
      --hielo: #9ec9e6;
    }

    html, body { min-height: 100%; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 18px 60px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse 120% 80% at 50% 30%, #101010 0%, var(--bg) 60%);
      pointer-events: none;
    }

    main { width: 100%; max-width: 520px; }

    .volver {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--faint);
      text-decoration: none;
      margin-bottom: 22px;
    }

    .volver:hover { color: var(--ink); }

    h1 {
      font-size: clamp(1.1rem, 5.4vw, 1.8rem);
      white-space: nowrap;
      font-weight: 200;
      letter-spacing: 0.18em;
      text-indent: 0.18em;
      text-transform: uppercase;
      text-align: center;
    }

    .manual {
      margin-top: 10px;
      text-align: center;
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: 13.5px;
      color: var(--dim);
    }

    /* ---------- resumen semanal ---------- */
    .semana {
      margin-top: 26px;
      padding: 16px 14px 14px;
      border: 1px solid rgba(245, 242, 234, 0.14);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.025);
    }

    .semana-cab {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 9px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 12px;
    }

    .semana-cab b { color: var(--gold); font-weight: 400; }

    .dias {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .dia-btn {
      appearance: none;
      border: 1px solid rgba(245, 242, 234, 0.14);
      border-radius: 10px;
      background: transparent;
      color: var(--dim);
      font-family: inherit;
      padding: 9px 2px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: border-color 0.25s ease, background 0.25s ease, color 0.25s ease;
    }

    .dia-btn span { font-size: 10px; letter-spacing: 0.1em; }

    .dia-btn i {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid rgba(245, 242, 234, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-style: normal;
      font-size: 10px;
      color: var(--faint);
      background: conic-gradient(var(--gold) calc(var(--p, 0) * 1%), transparent 0);
      -webkit-mask: radial-gradient(circle, transparent 55%, #000 57%);
              mask: radial-gradient(circle, transparent 55%, #000 57%);
    }

    .dia-btn.hoy { border-color: rgba(158, 201, 230, 0.55); }
    .dia-btn.activo { background: rgba(227, 192, 122, 0.1); border-color: var(--gold); color: var(--ink); }
    .dia-btn.hecho i { background: var(--gold); -webkit-mask: none; mask: none; border-color: var(--gold); }
    .dia-btn.descanso i { opacity: 0.35; }

    /* ---------- el día ---------- */
    .dia {
      margin-top: 18px;
      padding: 22px 18px 18px;
      border: 1px solid rgba(227, 192, 122, 0.24);
      border-radius: 14px;
      background: linear-gradient(170deg, rgba(227, 192, 122, 0.06), rgba(255, 255, 255, 0.012));
      animation: aparecer 0.35s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }

    .dia-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }

    .dia-nombre {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .dia-tipo {
      margin-top: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.15rem, 5.4vw, 1.45rem);
      line-height: 1.2;
    }

    .dia-foco {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.55;
      color: var(--dim);
    }

    .dia-prog {
      flex: 0 0 auto;
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--dim);
      padding-top: 2px;
    }

    .barra {
      height: 3px;
      border-radius: 2px;
      background: rgba(245, 242, 234, 0.12);
      margin: 16px 0 6px;
      overflow: hidden;
    }

    .barra span { display: block; height: 100%; width: 0; background: var(--gold); transition: width 0.4s ease; }

    .bloque-titulo {
      margin: 20px 0 8px;
      font-size: 9px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--hielo);
    }

    .bloque-nota { font-size: 11px; color: var(--faint); margin-bottom: 8px; letter-spacing: 0.02em; }

    .ejercicios { list-style: none; }

    .ej {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 4px;
      cursor: pointer;
      user-select: none;
    }

    .ejercicios > li { border-bottom: 1px solid rgba(245, 242, 234, 0.08); }
    .ejercicios > li:last-child { border-bottom: none; }

    .ej > input[type="checkbox"] { position: absolute; opacity: 0; pointer-events: none; }

    .caja {
      flex: 0 0 auto;
      width: 22px;
      height: 22px;
      margin-top: 1px;
      border-radius: 7px;
      border: 1.5px solid rgba(245, 242, 234, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #0a0a0a;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .ej.ok .caja { background: var(--gold); border-color: var(--gold); }

    .ej-txt { flex: 1; min-width: 0; }

    .ej-nombre { font-size: 14px; line-height: 1.4; transition: color 0.2s ease; }

    .enlace.ej-enlace { margin-top: 6px; }

    /* ---------- rutina en vídeo, desplegable ---------- */
    .rutina { margin-top: 12px; cursor: default; }

    .rutina summary {
      cursor: pointer;
      list-style: none;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--hielo);
    }

    .rutina summary::-webkit-details-marker { display: none; }
    .rutina summary::before { content: "+ "; color: var(--gold); }
    .rutina[open] summary::before { content: "– "; }

    .rut-lista { list-style: none; margin-top: 10px; }

    .rut-fila {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 6px 0;
      border-top: 1px solid rgba(245, 242, 234, 0.06);
      font-size: 12.5px;
    }

    .rut-n { flex: 0 0 18px; text-align: right; font-size: 11px; color: var(--gold); }
    .rut-txt { flex: 1 1 auto; min-width: 0; }
    .rut-nombre { display: block; color: var(--ink); line-height: 1.35; }
    .rut-es { display: block; font-size: 11.5px; color: var(--dim); line-height: 1.4; }
    .rut-t { flex: 0 0 auto; font-size: 11px; color: var(--dim); }

    .rut-descanso { padding: 3px 0; }
    .rut-descanso .rut-txt, .rut-descanso .rut-t { font-size: 10.5px; color: var(--faint); letter-spacing: 0.08em; }
    .rut-descanso .rut-n { color: var(--faint); }

    .ej-det { margin-top: 3px; font-size: 12px; color: var(--dim); line-height: 1.5; }


    /* ---------- pesos e historial ---------- */
    .extra { margin: -4px 0 14px 38px; font-size: 12px; }
    .peso { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .peso input {
      width: 84px; padding: 7px 9px; border-radius: 8px;
      border: 1px solid rgba(245, 242, 234, 0.25); background: transparent;
      color: var(--ink); font-family: inherit; font-size: 13px;
    }
    .peso input:focus-visible, .extra button:focus-visible, .extra summary:focus-visible,
    .unidad button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .peso .guardar {
      appearance: none; border-radius: 999px; padding: 7px 12px; cursor: pointer;
      border: 1px solid var(--gold); background: transparent; color: var(--gold);
      font-family: inherit; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    }
    .peso-ult { font-size: 11.5px; color: var(--dim); }
    .peso-ult.err { color: #e8a0a0; }
    .vez { margin-top: 5px; font-size: 11px; color: var(--faint); letter-spacing: 0.02em; }

    .hist { margin-top: 8px; }
    .hist summary {
      cursor: pointer; list-style: none; font-size: 10px; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--hielo);
    }
    .hist summary::-webkit-details-marker { display: none; }
    .hist-resumen { margin: 10px 0 4px; color: var(--dim); line-height: 1.5; }
    .hist svg { display: block; width: 100%; max-width: 340px; height: auto; margin: 6px 0; }
    .hist-lista { list-style: none; margin-top: 4px; }
    .hist-fila {
      display: flex; align-items: center; gap: 10px; padding: 6px 0;
      border-top: 1px solid rgba(245, 242, 234, 0.07); color: var(--ink);
    }
    .hist-fecha { flex: 0 0 62px; color: var(--dim); }
    .hist-val { flex: 1; }
    .hist-val small { color: var(--faint); margin-left: 4px; }
    .hist-dif { flex: 0 0 auto; font-size: 11px; }
    .hist-dif.sube { color: var(--gold); }
    .hist-dif.baja { color: var(--hielo); }
    .hist-borrar {
      appearance: none; flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; cursor: pointer;
      border: 1px solid rgba(245, 242, 234, 0.2); background: transparent; color: var(--dim); font-size: 12px;
    }
    .hist-borrar:hover { border-color: #e8a0a0; color: #e8a0a0; }

    .unidad { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin: 14px 0 -6px;
      font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--dim); }
    .unidad button {
      appearance: none; cursor: pointer; padding: 6px 14px; border-radius: 999px;
      border: 1px solid rgba(245, 242, 234, 0.25); background: transparent; color: var(--dim);
      font-family: inherit; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    }
    .unidad button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: rgba(227,192,122,0.1); }

    .ej.ok .ej-nombre { color: var(--dim); text-decoration: line-through; text-decoration-color: rgba(227,192,122,0.5); }

    .descanso-msg {
      margin-top: 18px;
      padding: 18px;
      border-radius: 10px;
      border: 1px dashed rgba(158, 201, 230, 0.3);
      font-size: 13px;
      line-height: 1.7;
      color: var(--dim);
      text-align: center;
    }

    .enlace {
      display: inline-block;
      margin-top: 12px;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 0.1em;
      text-decoration: none;
      border-bottom: 1px solid rgba(227,192,122,0.4);
    }

    .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

    .btn {
      flex: 1 1 auto;
      appearance: none;
      border-radius: 999px;
      padding: 12px 16px;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-indent: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      border: 1px solid rgba(245, 242, 234, 0.3);
      background: transparent;
      color: var(--ink);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .btn.primario { border-color: var(--gold); color: var(--gold); }
    .btn:hover { background: rgba(245, 242, 234, 0.06); }

    .hecho-msg {
      margin-top: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--gold);
      min-height: 1.2em;
    }

    footer {
      margin-top: 34px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      text-transform: uppercase;
      color: var(--faint);
    }
  </style>
</head>
<body>
  <main>
    <a class="volver" href="/">&larr; Volver</a>
    <h1>Quiero entrenar 🐧</h1>
    <p class="manual" id="manual"></p>

    <section class="semana">
      <div class="semana-cab">
        <span id="semanaTxt">Semana</span>
        <span>Hecho: <b id="semanaProg">0 / 7</b></span>
      </div>
      <div class="dias" id="dias"></div>
    </section>

    <div class="unidad" id="unidadSel" role="group" aria-label="Unidad de peso"></div>

    <section class="dia" id="dia"></section>

    <footer>Una semana a la vez 🐧</footer>
  </main>

  <script type="module" src="/src/analytics.js"></script>
  <script>
    // ---------- el plan ----------
    var TITULO = 'Manual de cuerpa para que Carlos te coma';

    // El enlace a la guía "Hyrox Weekends" (4 fines de semana). Si está
    // vacío, el sábado lo menciona sin enlazar.
    var HYROX_URL = '';

    var PLAN = [
      { dia: 'Lunes', corto: 'L', tipo: 'Gym · Jalón', foco: 'Glúteo e isquios + espalda y bíceps',
        bloques: [{ ejercicios: [
          { n: 'Hip thrust', d: '3 × (8 normales / 8 con pausa / 8 pulsos)' },
          { n: 'Peso muerto rumano', d: '4 × 12' },
          { n: 'Leg curl', d: '3 × 12, aguantando 2 s' },
          { n: 'Jalón al pecho', d: '4 × 12' },
          { n: 'Remo con mancuerna', d: '3 × 12 por brazo' },
          { n: 'Curl de bíceps o martillo', d: '3 × 12' }
        ] }] },
      { dia: 'Martes', corto: 'M', tipo: 'Pilates + abdominales', foco: 'Sesión completa y extra de abdominales',
        bloques: [{ ejercicios: [
          { n: 'Pilates', d: 'La clase de siempre' },
          { n: 'Extra de abdominales',
            d: 'Chloe Ting · Get Abs in 2 Weeks. 30 s por ejercicio y 10 s de descanso cada dos: unos 10 minutos.',
            enlace: { url: 'https://www.youtube.com/watch?v=2pLT-olgUJs', texto: 'Ver la rutina en YouTube' },
            rutina: [
              { n: 'Leg Raise Clap', es: 'elevación de piernas + palmada', t: 30 },
              { n: 'Reverse Crunch', es: 'abdominal invertido', t: 30 },
              { descanso: 10 },
              { n: 'Spider-Man Plank', es: 'plancha Spider-Man', t: 30 },
              { n: 'Cross-Body Mountain Climber', es: 'escalador cruzado', t: 30 },
              { descanso: 10 },
              { n: 'Russian Twist', es: 'giros rusos', t: 30 },
              { n: 'In & Out', es: 'abrir y cerrar piernas sentada', t: 30 },
              { descanso: 10 },
              { n: 'Plank with Hip Dips', es: 'plancha con giros de cadera', t: 30 },
              { n: 'Plank Jacks', es: 'plancha abriendo y cerrando piernas', t: 30 },
              { descanso: 10 },
              { n: '100s · The Hundreds', es: 'abdominales 100', t: 30 },
              { n: 'Crunches', es: 'abdominales clásicos', t: 30 },
              { descanso: 10 },
              { n: 'Up & Down Plank', es: 'plancha subiendo y bajando', t: 30 },
              { n: 'Plank', es: 'plancha estática', t: 30 },
              { descanso: 10 },
              { n: 'Heel Touches', es: 'tocar talones', t: 30 },
              { n: 'Bicycle Crunches', es: 'bicicleta', t: 30 },
              { descanso: 10 },
              { n: 'Reverse Crunch + Leg Extension', es: 'abdominal invertido + extensión de piernas', t: 30 },
              { n: 'Straight Leg Crunch', es: 'crunch con piernas elevadas', t: 30 },
              { descanso: 10 },
              { n: 'Up & Down Plank', es: 'plancha subiendo y bajando', t: 30 }
            ] }
        ] }] },
      { dia: 'Miércoles', corto: 'X', tipo: 'Gym · Empuje', foco: 'Cuádriceps + hombro y tríceps',
        bloques: [{ ejercicios: [
          { n: 'Hack squat', d: '4 × 12 (si no hay máquina, sentadilla con barra)' },
          { n: 'Prensa', d: '4 × 12' },
          { n: 'Sentadilla búlgara', d: '3 × 10 por pierna' },
          { n: 'Extensiones de cuádriceps', d: '3 × 15' },
          { n: 'Press de hombro con mancuernas', d: '4 × 12' },
          { n: 'Elevaciones laterales', d: '3 × 12' },
          { n: 'Tríceps en polea', d: '3 × 15' }
        ] }] },
      { dia: 'Jueves', corto: 'J', tipo: 'Hyrox', foco: 'Segunda sesión Hyrox de la semana',
        hyrox: true,
        hyroxNota: 'Ya hay volumen para dos sesiones de Hyrox por semana: jueves y sábado.',
        // id propio: lo que se marcó como descanso activo no cuenta como Hyrox
        bloques: [{ ejercicios: [ { id: 'hyrox-jueves', n: 'Sesión Hyrox entre semana', d: 'Según la guía' } ] }] },
      { dia: 'Viernes', corto: 'V', tipo: 'Gym · Glúteo + tren superior + core', foco: 'Tres bloques',
        bloques: [
          { titulo: 'Bloque 1 · Glúteo pesado', ejercicios: [
            { n: 'Hip thrust', d: '4 × 10, drop set en la última (baja un 30 % del peso y sigue hasta el fallo)' },
            { n: 'Hiperextensión enfocada a glúteo con disco', d: '3 × 12 + 10 pulsos' },
            { n: 'Abducción en máquina', d: '3 × (15 sentada erguida + 15 inclinada hacia delante)' },
            { n: 'Patada de glúteo en polea', d: '3 × 12 por pierna, aguantando 1 s arriba' }
          ] },
          { titulo: 'Bloque 2 · Tren superior', nota: 'Superseries, 60 s de descanso', ejercicios: [
            { n: 'Jalón al pecho + flexiones', d: '3 × 12 + 3 × máx. (en rodillas si hace falta)' },
            { n: 'Remo en polea baja + elevaciones laterales', d: '3 × 12 + 3 × 15' }
          ] },
          { titulo: 'Bloque 3 · Finisher de core', nota: '3 rondas sin pausa', ejercicios: [
            { n: 'Plancha', d: '45 s' },
            { n: 'Dead bug', d: '12 por lado' },

            { n: 'Hollow hold', d: '30 s' }
          ] }
        ] },
      { dia: 'Sábado', corto: 'S', tipo: 'Hyrox', foco: 'Guía "Hyrox Weekends" · 4 fines de semana',
        hyrox: true,
        hyroxNota: 'Sigue la guía "Hyrox Weekends": cuatro fines de semana, uno por sábado.',
        bloques: [{ ejercicios: [ { n: 'Sesión Hyrox del fin de semana', d: 'Según la guía' } ] }] },
      { dia: 'Domingo', corto: 'D', tipo: 'Descanso', foco: 'Sin culpa',
        descanso: true,
        bloques: [{ ejercicios: [ { n: 'Descansar', d: 'Es parte del plan' } ] }] }
    ];

    // ---------- semana y guardado ----------
    function pad(n) { return String(n).padStart(2, '0'); }

    function lunesDe(fecha) {
      var d = new Date(fecha.getFullYear(), fecha.getMonth(), fecha.getDate());
      var dow = (d.getDay() + 6) % 7;          // lunes = 0
      d.setDate(d.getDate() - dow);
      return d;
    }

    function claveSemana() {
      var l = lunesDe(new Date());
      return l.getFullYear() + '-' + pad(l.getMonth() + 1) + '-' + pad(l.getDate());
    }

    var KEY = 'entreno-' + claveSemana();

    function cargar() {
      try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
    }

    function guardar(est) {
      try { localStorage.setItem(KEY, JSON.stringify(est)); } catch (e) {}
    }

    var estado = cargar();
    var hoyIdx = (new Date().getDay() + 6) % 7;
    var activo = hoyIdx;

    function idsDe(d) {
      var ids = [];
      PLAN[d].bloques.forEach(function (b, bi) {
        b.ejercicios.forEach(function (e, ei) { ids.push(e.id || bi + '-' + ei); });
      });
      return ids;
    }

    function progreso(d) {
      var ids = idsDe(d), hechos = estado[d] || [];
      var n = ids.filter(function (id) { return hechos.indexOf(id) !== -1; }).length;
      return { n: n, total: ids.length, pct: ids.length ? Math.round(n / ids.length * 100) : 0 };
    }

    // ---------- base de datos (Supabase) ----------
    // Tablas: `pesos_entreno` y `ejercicios_hechos` (ver supabase-entreno-v2.sql).
    // Clave pública (anon / publishable) del proyecto. Sin clave, o sin conexión,
    // todo queda guardado en este navegador y se sube cuando vuelva la conexión.
    var SUPABASE_URL = 'https://vjnxxxeivtptkvczwexj.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_dhlBvkmZaWZC29szeVxMeQ_abPtQwXg';
    var PEND_KEY = 'entreno-pendientes';
    var UNIDAD_KEY = 'entreno-unidad';
    var LB = 2.20462;

    function usaNube() { return !!(SUPABASE_URL && SUPABASE_ANON_KEY); }
    function cabeceras(extra) {
      return Object.assign({ apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
                             'Content-Type': 'application/json' }, extra || {});
    }
    function rest(ruta, opc) {
      opc = opc || {}; opc.headers = cabeceras(opc.headers);
      return fetch(SUPABASE_URL + '/rest/v1/' + ruta, opc).then(function (r) {
        if (!r.ok) { var e = new Error(r.status); e.status = r.status; throw e; }
        return r.status === 204 ? null : r.text().then(function (t) { return t ? JSON.parse(t) : null; });
      });
    }

    // ---- unidad (kg / lb), por dispositivo
    var unidad = 'kg';
    try { if (localStorage.getItem(UNIDAD_KEY) === 'lb') unidad = 'lb'; } catch (e) {}
    function redondear(v) { return Math.round(v * 10) / 10; }
    function aKg(v, u) { return u === 'lb' ? v / LB : v; }
    // el valor de un registro en la unidad elegida (si se anotó en ella, tal cual)
    function valorDe(r) { return r.unidad === unidad ? r.valor : redondear(unidad === 'lb' ? r.kg * LB : r.kg); }

    // ---- registros de peso: los de la nube + los pendientes de subir
    var nube = [];
    function normalizar(f) {
      return { id: f.id, dia: f.dia, ejercicio: f.ejercicio, kg: Number(f.kg),
               valor: f.valor != null ? Number(f.valor) : Number(f.kg), unidad: f.unidad || 'kg', fecha: f.created_at };
    }
    function leerPend() { try { return JSON.parse(localStorage.getItem(PEND_KEY)) || []; } catch (e) { return []; } }
    function escribirPend(l) { try { localStorage.setItem(PEND_KEY, JSON.stringify(l)); } catch (e) {} }
    function registrosDe(d, nombre) {
      var dia = PLAN[d].dia;
      return nube.concat(leerPend()).filter(function (r) { return r.dia === dia && r.ejercicio === nombre; })
        .sort(function (a, b) { return new Date(a.fecha) - new Date(b.fecha); });
    }

    function cuerpoPost(f, completo) {
      var o = { semana: f.semana, dia: f.dia, ejercicio: f.ejercicio, kg: f.kg, created_at: f.fecha };
      if (completo) { o.valor = f.valor; o.unidad = f.unidad; }
      return JSON.stringify(o);
    }
    // si aún no se ha ejecutado el SQL nuevo (columnas valor/unidad), reintenta sin ellas
    function subir(f) {
      var opc = function (completo) {
        return { method: 'POST', headers: { Prefer: 'return=representation' }, body: cuerpoPost(f, completo) };
      };
      return rest('pesos_entreno', opc(true)).catch(function (e) {
        if (e.status === 400) return rest('pesos_entreno', opc(false));
        throw e;
      }).then(function (filas) { return normalizar(filas[0]); });
    }

    var COLS = 'id,dia,ejercicio,kg,created_at';
    function cargarRegistros() {
      var q = '?order=created_at.desc&limit=3000&select=';
      return rest('pesos_entreno' + q + COLS + ',valor,unidad').catch(function (e) {
        if (e.status === 400) return rest('pesos_entreno' + q + COLS);
        throw e;
      }).then(function (filas) { nube = filas.map(normalizar); });
    }

    function subirPendientes() {
      var pend = leerPend();
      if (!pend.length) return Promise.resolve();
      return pend.reduce(function (p, f) {
        return p.then(function () {
          return subir(f).then(function (r) {
            escribirPend(leerPend().filter(function (x) { return x.id !== f.id; }));
            nube.push(r);
          }).catch(function () {});
        });
      }, Promise.resolve());
    }

    function guardarPeso(d, nombre, valor) {
      var fila = { id: 'p' + Date.now() + Math.random().toString(36).slice(2, 6), semana: claveSemana(),
                   dia: PLAN[d].dia, ejercicio: nombre, kg: Math.round(aKg(valor, unidad) * 100) / 100,
                   valor: valor, unidad: unidad, fecha: new Date().toISOString(), pendiente: true };
      var aPendiente = function () { escribirPend(leerPend().concat([fila])); return { pendiente: true }; };
      if (!usaNube()) return Promise.resolve(aPendiente());
      return subir(fila).then(function (r) { nube.push(r); return { pendiente: false }; })
        .catch(aPendiente);
    }

    function borrarRegistro(r) {
      if (r.pendiente) { escribirPend(leerPend().filter(function (x) { return x.id !== r.id; })); return Promise.resolve(); }
      return rest('pesos_entreno?id=eq.' + encodeURIComponent(r.id), { method: 'DELETE', headers: { Prefer: 'return=representation' } })
        .then(function (filas) {
          if (!filas || !filas.length) throw new Error('sin permiso');
          nube = nube.filter(function (x) { return x.id !== r.id; });
        });
    }

    // ---- ejercicios marcados y última vez que se marcó cada uno
    var ultimaVez = {};   // 'Día|Ejercicio' -> fecha ISO
    function listaEj(d) {
      var l = [];
      PLAN[d].bloques.forEach(function (b, bi) {
        b.ejercicios.forEach(function (e, ei) { l.push({ id: e.id || bi + '-' + ei, n: e.n }); });
      });
      return l;
    }
    function sincronizarHechos(d, items, on) {
      if (!items.length) return;
      var ahora = new Date().toISOString();
      var filas = items.map(function (x) {
        var f = { semana: claveSemana(), dia: PLAN[d].dia, ejercicio: x.n, hecho: on };
        if (on) { f.marcado_at = ahora; ultimaVez[PLAN[d].dia + '|' + x.n] = ahora; }
        return f;
      });
      if (!usaNube()) return;
      rest('ejercicios_hechos?on_conflict=semana,dia,ejercicio', {
        method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(filas)
      }).then(function () { if (!on) return cargarHechos(true).then(pintar); }).catch(function () {});
    }
    // soloUltima: refresca únicamente "última vez" (tras desmarcar), sin tocar lo marcado en pantalla
    function cargarHechos(soloUltima) {
      return rest('ejercicios_hechos?select=semana,dia,ejercicio,hecho,marcado_at&limit=5000').then(function (filas) {
        var semana = claveSemana(), marcados = {}, uv = {};
        filas.forEach(function (f) {
          var k = f.dia + '|' + f.ejercicio;
          if (f.hecho && (!uv[k] || f.marcado_at > uv[k])) uv[k] = f.marcado_at;
          if (f.hecho && f.semana === semana) marcados[k] = true;
        });
        ultimaVez = uv;
        if (soloUltima) return;
        estado = {};
        PLAN.forEach(function (p, d) {
          var ids = listaEj(d).filter(function (x) { return marcados[p.dia + '|' + x.n]; }).map(function (x) { return x.id; });
          if (ids.length) estado[d] = ids;
        });
        guardar(estado);
      });
    }

    function cargarTodo() {
      if (!usaNube()) { pintar(); return; }
      cargarRegistros().then(subirPendientes).catch(function () {})
        .then(function () { return cargarHechos().catch(function () {}); })
        .then(pintar);
    }

    // ---- formato
    var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    function fechaCorta(iso) { var f = new Date(iso); return f.getDate() + ' ' + MESES[f.getMonth()]; }
    function esHoy(iso) { return new Date(iso).toDateString() === new Date().toDateString(); }
    function textoUltimo(regs) {
      if (!regs.length) return 'Sin registro';
      var r = regs[regs.length - 1];
      return 'Último: ' + valorDe(r) + ' ' + unidad + ' · ' + fechaCorta(r.fecha);
    }

    var avisoTxt = '', avisoT = 0;
    function mostrarAviso(txt) {
      avisoTxt = txt; clearTimeout(avisoT);
      var el = document.querySelector('.hecho-msg'); if (el && txt) el.textContent = txt;
      avisoT = setTimeout(function () { avisoTxt = ''; var m = document.querySelector('.hecho-msg'); if (m) pintarDia(); }, 4500);
    }

    var borradores = {};  // lo escrito y aún sin guardar, para no perderlo al repintar

    // gráfica de progreso: una línea con los últimos registros
    function grafica(regs) {
      var pts = regs.slice(-40).map(valorDe), W = 300, H = 90, X = 28, Y = 12;
      var min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
      if (min === max) { min -= 1; max += 1; }
      var ns = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', 'Progreso de ' + pts[0] + ' a ' + pts[pts.length - 1] + ' ' + unidad);
      function el(n, a) { var e = document.createElementNS(ns, n); for (var k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
      function xy(i) { return [X + (W - X - 8) * (pts.length === 1 ? 0.5 : i / (pts.length - 1)), H - Y - (H - 2 * Y) * (pts[i] - min) / (max - min)]; }
      el('line', { x1: X, y1: Y, x2: W - 8, y2: Y, stroke: 'rgba(245,242,234,0.08)' });
      el('line', { x1: X, y1: H - Y, x2: W - 8, y2: H - Y, stroke: 'rgba(245,242,234,0.08)' });
      var t1 = el('text', { x: 0, y: Y + 3, fill: 'rgba(245,242,234,0.55)', 'font-size': 9 }); t1.textContent = redondear(max);
      var t2 = el('text', { x: 0, y: H - Y + 3, fill: 'rgba(245,242,234,0.55)', 'font-size': 9 }); t2.textContent = redondear(min);
      el('polyline', { points: pts.map(function (_, i) { return xy(i).join(','); }).join(' '),
                       fill: 'none', stroke: '#e3c07a', 'stroke-width': 1.8, 'stroke-linejoin': 'round' });
      pts.forEach(function (_, i) { var c = xy(i); el('circle', { cx: c[0], cy: c[1], r: 2.6, fill: '#e3c07a' }); });
      return svg;
    }

    function pintarHistorial(d, nombre, regs, refrescar) {
      var det = document.createElement('details'); det.className = 'hist';
      var vals = regs.map(valorDe), mejor = Math.max.apply(null, vals);
      var sum = document.createElement('summary');
      sum.textContent = 'Progreso · ' + regs.length + (regs.length === 1 ? ' registro' : ' registros') + ' · mejor ' + mejor + ' ' + unidad;
      det.appendChild(sum);

      if (regs.length > 1) {
        var dif = redondear(vals[vals.length - 1] - vals[0]);
        var res = document.createElement('div'); res.className = 'hist-resumen';
        res.textContent = 'De ' + vals[0] + ' a ' + vals[vals.length - 1] + ' ' + unidad +
                          ' (' + (dif > 0 ? '+' : '') + dif + ') desde el ' + fechaCorta(regs[0].fecha);
        det.appendChild(res); det.appendChild(grafica(regs));
      }

      var ul = document.createElement('ul'); ul.className = 'hist-lista';
      regs.slice().reverse().slice(0, 60).forEach(function (r, i, arr) {
        var li = document.createElement('li'); li.className = 'hist-fila';
        var f = document.createElement('span'); f.className = 'hist-fecha'; f.textContent = fechaCorta(r.fecha);
        var v = document.createElement('span'); v.className = 'hist-val'; v.textContent = valorDe(r) + ' ' + unidad;
        if (r.pendiente) { var sm = document.createElement('small'); sm.textContent = 'sin subir'; v.appendChild(sm); }
        li.appendChild(f); li.appendChild(v);
        var ant = arr[i + 1];
        if (ant) {
          var dd = redondear(valorDe(r) - valorDe(ant));
          if (dd) {
            var s = document.createElement('span'); s.className = 'hist-dif ' + (dd > 0 ? 'sube' : 'baja');
            s.textContent = (dd > 0 ? '▲ ' : '▼ ') + Math.abs(dd); li.appendChild(s);
          }
        }
        var x = document.createElement('button'); x.type = 'button'; x.className = 'hist-borrar'; x.textContent = '✕';
        x.setAttribute('aria-label', 'Borrar el registro de ' + valorDe(r) + ' ' + unidad + ' del ' + fechaCorta(r.fecha));
        x.addEventListener('click', function () {
          if (!window.confirm('¿Borrar ' + valorDe(r) + ' ' + unidad + ' (' + fechaCorta(r.fecha) + ') de ' + nombre + '?')) return;
          borrarRegistro(r).then(function () { mostrarAviso('Registro borrado'); refrescar(); })
            .catch(function () { mostrarAviso('No se pudo borrar. ¿Está ejecutado el SQL nuevo en Supabase?'); });
        });
        li.appendChild(x); ul.appendChild(li);
      });
      det.appendChild(ul);
      return det;
    }

    // bloque bajo cada ejercicio de gimnasio: anotar peso, último y progreso
    function pintarPeso(d, nombre, id) {
      var cont = document.createElement('div'); cont.className = 'extra';
      var k = PLAN[d].dia + '|' + nombre;
      var regs = registrosDe(d, nombre);

      var fila = document.createElement('div'); fila.className = 'peso';
      var inp = document.createElement('input');
      inp.type = 'number'; inp.min = '0'; inp.step = '0.5'; inp.inputMode = 'decimal';
      inp.placeholder = unidad; inp.setAttribute('aria-label', 'Peso en ' + unidad + ' de ' + nombre);
      if (borradores[k]) inp.value = borradores[k];
      inp.addEventListener('input', function () { borradores[k] = inp.value; });
      var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'guardar'; btn.textContent = 'Guardar';
      var ult = document.createElement('span'); ult.className = 'peso-ult'; ult.textContent = textoUltimo(regs);

      function enviar() {
        var v = parseFloat(String(inp.value).replace(',', '.'));
        if (!(v > 0 && v <= 2000)) { ult.className = 'peso-ult err'; ult.textContent = 'Escribe un peso válido'; return; }
        btn.disabled = true; ult.className = 'peso-ult'; ult.textContent = 'Guardando…';
        guardarPeso(d, nombre, v).then(function (res) {
          delete borradores[k];
          var hechos = estado[d] || [];
          if (hechos.indexOf(id) === -1) marcar(d, id, true); else pintar();
          mostrarAviso(res.pendiente ? 'Guardado en este móvil; se subirá cuando haya conexión' : 'Peso guardado');
        });
      }
      btn.addEventListener('click', enviar);
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); enviar(); } });
      fila.appendChild(inp); fila.appendChild(btn); fila.appendChild(ult);
      cont.appendChild(fila);

      if (regs.length) cont.appendChild(pintarHistorial(d, nombre, regs, pintar));
      return cont;
    }

    // el selector de unidad
    function pintarUnidad() {
      var box = document.getElementById('unidadSel'); box.innerHTML = '';
      var t = document.createElement('span'); t.textContent = 'Peso en'; box.appendChild(t);
      ['kg', 'lb'].forEach(function (u) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = u;
        b.setAttribute('aria-pressed', String(u === unidad));
        b.addEventListener('click', function () {
          unidad = u; try { localStorage.setItem(UNIDAD_KEY, u); } catch (e) {}
          borradores = {}; pintarUnidad(); pintarDia();
        });
        box.appendChild(b);
      });
    }

    // ---------- pintar ----------
    var manual = document.getElementById('manual');
    var diasEl = document.getElementById('dias');
    var diaEl = document.getElementById('dia');
    var semanaTxt = document.getElementById('semanaTxt');
    var semanaProg = document.getElementById('semanaProg');

    manual.textContent = TITULO;

    function pintarSemana() {
      var l = lunesDe(new Date());
      var dom = new Date(l); dom.setDate(l.getDate() + 6);
      var f = function (x) { return x.getDate() + ' ' + x.toLocaleDateString('es-ES', { month: 'short' }).replace('.', ''); };
      semanaTxt.textContent = 'Semana del ' + f(l) + ' al ' + f(dom);

      var completos = 0;
      diasEl.innerHTML = '';
      PLAN.forEach(function (p, i) {
        var pr = progreso(i);
        if (pr.pct === 100) completos++;
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'dia-btn' + (i === hoyIdx ? ' hoy' : '') + (i === activo ? ' activo' : '')
                    + (pr.pct === 100 ? ' hecho' : '') + (p.descanso ? ' descanso' : '');
        b.setAttribute('aria-label', p.dia);
        var s = document.createElement('span'); s.textContent = p.corto;
        var ic = document.createElement('i');
        ic.style.setProperty('--p', pr.pct);
        ic.textContent = pr.pct === 100 ? '✓' : '';
        b.appendChild(s); b.appendChild(ic);
        b.addEventListener('click', function () { activo = i; pintar(); });
        diasEl.appendChild(b);
      });
      semanaProg.textContent = completos + ' / 7';
    }

    function pintarDia() {
      var p = PLAN[activo], pr = progreso(activo);
      diaEl.innerHTML = '';

      var cab = document.createElement('div'); cab.className = 'dia-cab';
      var izq = document.createElement('div');
      var nom = document.createElement('div'); nom.className = 'dia-nombre';
      nom.textContent = p.dia + (activo === hoyIdx ? ' · hoy' : '');
      var tipo = document.createElement('div'); tipo.className = 'dia-tipo'; tipo.textContent = p.tipo;
      var foco = document.createElement('div'); foco.className = 'dia-foco'; foco.textContent = p.foco;
      izq.appendChild(nom); izq.appendChild(tipo); izq.appendChild(foco);
      var prog = document.createElement('div'); prog.className = 'dia-prog';
      prog.textContent = pr.n + ' / ' + pr.total;
      cab.appendChild(izq); cab.appendChild(prog);
      diaEl.appendChild(cab);

      var barra = document.createElement('div'); barra.className = 'barra';
      var fill = document.createElement('span'); fill.style.width = pr.pct + '%';
      barra.appendChild(fill); diaEl.appendChild(barra);

      var hechos = estado[activo] || [];
      p.bloques.forEach(function (b, bi) {
        if (b.titulo) {
          var t = document.createElement('div'); t.className = 'bloque-titulo'; t.textContent = b.titulo;
          diaEl.appendChild(t);
        }
        if (b.nota) {
          var nt = document.createElement('div'); nt.className = 'bloque-nota'; nt.textContent = b.nota;
          diaEl.appendChild(nt);
        }
        var ul = document.createElement('ul'); ul.className = 'ejercicios';
        b.ejercicios.forEach(function (e, ei) {
          var id = e.id || bi + '-' + ei;
          var li = document.createElement('li');
          var lab = document.createElement('label');
          lab.className = 'ej' + (hechos.indexOf(id) !== -1 ? ' ok' : '');
          var inp = document.createElement('input');
          inp.type = 'checkbox'; inp.checked = hechos.indexOf(id) !== -1;
          var caja = document.createElement('span'); caja.className = 'caja';
          caja.textContent = inp.checked ? '✓' : '';
          var txt = document.createElement('span'); txt.className = 'ej-txt';
          var n = document.createElement('div'); n.className = 'ej-nombre'; n.textContent = e.n;
          txt.appendChild(n);
          if (e.d) { var d = document.createElement('div'); d.className = 'ej-det'; d.textContent = e.d; txt.appendChild(d); }
          if (e.enlace) {
            var ea = document.createElement('a'); ea.className = 'enlace ej-enlace'; ea.href = e.enlace.url;
            ea.target = '_blank'; ea.rel = 'noopener noreferrer'; ea.textContent = e.enlace.texto;
            ea.addEventListener('click', function (ev) { ev.stopPropagation(); });
            txt.appendChild(ea);
          }
          if (e.rutina) txt.appendChild(pintarRutina(e.rutina));
          var uv = ultimaVez[p.dia + '|' + e.n];
          if (uv) {
            var vz = document.createElement('div'); vz.className = 'vez';
            vz.textContent = 'Última vez: ' + (esHoy(uv) ? 'hoy' : fechaCorta(uv)); txt.appendChild(vz);
          }
          lab.appendChild(inp); lab.appendChild(caja); lab.appendChild(txt);
          inp.addEventListener('change', function () { marcar(activo, id, inp.checked); });
          li.appendChild(lab);
          if (/^Gym/.test(p.tipo)) li.appendChild(pintarPeso(activo, e.n, id));
          ul.appendChild(li);
        });
        diaEl.appendChild(ul);
      });

      if (p.hyrox) {
        var m = document.createElement('div'); m.className = 'descanso-msg';
        m.textContent = p.hyroxNota;
        if (HYROX_URL) {
          var a = document.createElement('a'); a.className = 'enlace'; a.href = HYROX_URL;
          a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = 'Abrir la guía';
          m.appendChild(document.createElement('br')); m.appendChild(a);
        }
        diaEl.appendChild(m);
      }

      var acc = document.createElement('div'); acc.className = 'acciones';
      var todo = document.createElement('button'); todo.type = 'button'; todo.className = 'btn primario';
      todo.textContent = pr.pct === 100 ? 'Día completado' : 'Marcar todo el día';
      todo.disabled = pr.pct === 100;
      todo.addEventListener('click', function () {
        var antes = estado[activo] || [];
        sincronizarHechos(activo, listaEj(activo).filter(function (x) { return antes.indexOf(x.id) === -1; }), true);
        estado[activo] = idsDe(activo); guardar(estado); pintar();
      });
      var limpiar = document.createElement('button'); limpiar.type = 'button'; limpiar.className = 'btn';
      limpiar.textContent = 'Reiniciar día';
      limpiar.addEventListener('click', function () {
        var antes = estado[activo] || [];
        sincronizarHechos(activo, listaEj(activo).filter(function (x) { return antes.indexOf(x.id) !== -1; }), false);
        delete estado[activo]; guardar(estado); pintar();
      });
      acc.appendChild(todo); acc.appendChild(limpiar);
      diaEl.appendChild(acc);

      var msg = document.createElement('div'); msg.className = 'hecho-msg';
      msg.textContent = avisoTxt || (pr.pct === 100 ? (p.descanso ? 'Descansado. Eso también cuenta 🐧' : 'Día hecho. Cuerpa en marcha 🐧') : '');
      diaEl.appendChild(msg);
    }

    // una rutina en vídeo: se lee, no se marca ejercicio a ejercicio
    function pintarRutina(lista) {
      var ejercicios = lista.filter(function (r) { return !r.descanso; });
      var segundos = lista.reduce(function (acc, r) { return acc + (r.descanso || r.t || 0); }, 0);
      var min = Math.floor(segundos / 60), seg = segundos % 60;

      var det = document.createElement('details'); det.className = 'rutina';
      var sum = document.createElement('summary');
      sum.textContent = 'La rutina exacta · ' + ejercicios.length + ' ejercicios · ' +
                        min + ' min' + (seg ? ' ' + seg + ' s' : '');
      det.appendChild(sum);

      var ol = document.createElement('ol'); ol.className = 'rut-lista';
      var num = 0;
      lista.forEach(function (r) {
        var li = document.createElement('li');
        var a = document.createElement('span'); a.className = 'rut-n';
        var b = document.createElement('span'); b.className = 'rut-txt';
        var c = document.createElement('span'); c.className = 'rut-t';
        if (r.descanso) {
          li.className = 'rut-fila rut-descanso';
          a.textContent = '·';
          b.textContent = 'Descanso';
          c.textContent = r.descanso + ' s';
        } else {
          li.className = 'rut-fila';
          a.textContent = ++num;
          var n = document.createElement('span'); n.className = 'rut-nombre'; n.textContent = r.n;
          var es = document.createElement('span'); es.className = 'rut-es'; es.textContent = r.es;
          b.appendChild(n); b.appendChild(es);
          c.textContent = r.t + ' s';
        }
        li.appendChild(a); li.appendChild(b); li.appendChild(c);
        ol.appendChild(li);
      });
      det.appendChild(ol);

      // abrir o cerrar la lista no marca el ejercicio
      det.addEventListener('click', function (ev) { ev.stopPropagation(); });
      return det;
    }

    function marcar(d, id, on) {
      var arr = estado[d] || [];
      if (on && arr.indexOf(id) === -1) arr.push(id);
      if (!on) arr = arr.filter(function (x) { return x !== id; });
      estado[d] = arr;
      guardar(estado);
      sincronizarHechos(d, listaEj(d).filter(function (x) { return x.id === id; }), on);
      pintar();
    }

    function pintar() { pintarSemana(); pintarDia(); }
    pintarUnidad();
    pintar();
    cargarTodo();
  </script>
</body>

<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/icon-512.svg" />
  <title>Quiero entrenar 🐧</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Los mismos tokens que la portada: una rejilla, un tipo de tarjeta,
       el dorado para lo que importa y el azul hielo para lo secundario. */
    :root {
      --bg: #050505;
      --ink: #f5f2ea;
      --dim: rgba(245, 242, 234, 0.6);
      --faint: rgba(245, 242, 234, 0.32);
      --gold: #e3c07a;
      --hielo: #9ec9e6;
      --rojo: #e8a0a0;
      --linea: rgba(245, 242, 234, 0.1);
      --tarjeta-borde: rgba(245, 242, 234, 0.14);
      --tarjeta-fondo: linear-gradient(170deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.008)), #0a0a0b;
      --radio: 18px;
      --serif: Georgia, "Times New Roman", serif;
      --toque: 46px;          /* lo mínimo para tocar con el dedo y sin mirar */
    }

    html { -webkit-text-size-adjust: 100%; scroll-padding-top: 76px; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 300;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      /* sitio para la barra de abajo */
      padding-bottom: calc(118px + env(safe-area-inset-bottom, 0px));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(ellipse 120% 80% at 50% 20%, #101010 0%, var(--bg) 60%);
      pointer-events: none;
    }

    button { font-family: inherit; }
    button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 2px;
    }

    /* ---------- barra superior ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 14px max(16px, calc((100% - 1040px) / 2));
      padding-top: calc(14px + env(safe-area-inset-top, 0px));
      background: rgba(5, 5, 5, 0.78);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--linea);
    }

    .topbar-volver {
      justify-self: start;
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      font-size: 10.5px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
    }
    .topbar-volver:hover { color: var(--ink); }

    .topbar-marca {
      font-size: 11.5px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .topbar-hoy {
      justify-self: end;
      font-size: 10.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      white-space: nowrap;
    }

    /* ---------- rejilla ---------- */
    .layout {
      width: 100%;
      max-width: 1072px;
      margin: 0 auto;
      padding: 30px 16px 0;
      display: grid;
      gap: 16px;
    }

    .hero { text-align: center; padding: 6px 0 10px; }

    h1 {
      font-size: clamp(1.25rem, 5.6vw, 2rem);
      font-weight: 200;
      letter-spacing: 0.2em;
      text-indent: 0.2em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .manual {
      margin-top: 10px;
      font-family: var(--serif);
      font-style: italic;
      font-size: 14px;
      color: var(--dim);
    }

    .lado { display: grid; gap: 16px; align-content: start; }

    .tarjeta {
      border: 1px solid var(--tarjeta-borde);
      border-radius: var(--radio);
      background: var(--tarjeta-fondo);
    }

    /* en el ordenador: la semana y el día a la izquierda, fijos; los
       ejercicios a la derecha */
    @media (min-width: 900px) {
      .layout {
        grid-template-columns: 360px 1fr;
        column-gap: 28px;
        padding-top: 40px;
      }
      .hero, .pie { grid-column: 1 / -1; }
      .hero { padding-bottom: 18px; }
      .lado { position: sticky; top: 84px; }
    }

    /* ---------- la semana ---------- */
    .semana { padding: 16px 14px 14px; }

    .semana-cab {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 12px;
      font-size: 9.5px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .semana-cab b { color: var(--gold); font-weight: 400; }

    .dias {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .dia-btn {
      appearance: none;
      min-height: 72px;
      padding: 9px 0 8px;
      border: 1px solid var(--linea);
      border-radius: 12px;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
    }

    .dia-btn .letra { font-size: 10px; letter-spacing: 0.12em; }
    .dia-btn .fecha { font-size: 15px; color: var(--ink); font-variant-numeric: tabular-nums; }

    .dia-btn i {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-style: normal;
      font-size: 9px;
      color: #0a0a0a;
      background:
        conic-gradient(var(--gold) calc(var(--p, 0) * 1%), rgba(245, 242, 234, 0.16) 0);
      -webkit-mask: radial-gradient(circle, transparent 50%, #000 53%);
              mask: radial-gradient(circle, transparent 50%, #000 53%);
    }

    .dia-btn.hoy { border-color: rgba(158, 201, 230, 0.5); }
    .dia-btn.hoy .letra { color: var(--hielo); }
    .dia-btn.activo { background: rgba(227, 192, 122, 0.1); border-color: var(--gold); color: var(--ink); }
    .dia-btn.hecho i { background: var(--gold); -webkit-mask: none; mask: none; }
    .dia-btn.descanso i { opacity: 0.4; }

    /* ---------- el día elegido ---------- */
    .resumen { padding: 20px 18px 18px; }

    .res-cab { display: flex; justify-content: space-between; align-items: center; gap: 14px; }

    .dia-nombre {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .dia-tipo {
      margin-top: 8px;
      font-family: var(--serif);
      font-size: clamp(1.3rem, 6vw, 1.6rem);
      line-height: 1.2;
    }

    .dia-foco { margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--dim); }

    /* el anillo de progreso del día */
    .anillo {
      flex: none;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      background: conic-gradient(var(--gold) calc(var(--p, 0) * 1%), rgba(245, 242, 234, 0.1) 0);
    }

    .anillo::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #0b0b0c;
    }

    .anillo span {
      position: relative;
      font-size: 22px;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
    }

    .anillo small { font-size: 12px; color: var(--dim); }

    .opciones {
      display: grid;
      gap: 10px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--linea);
    }

    .opcion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .segmento {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--tarjeta-borde);
      border-radius: 999px;
    }

    .segmento button {
      appearance: none;
      min-width: 52px;
      min-height: 34px;
      padding: 0 12px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--dim);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .segmento button[aria-pressed="true"] { background: var(--gold); color: #0a0a0a; font-weight: 400; }

    .ajustes {
      margin-top: 16px;
      border-top: 1px solid var(--linea);
    }

    .ajustes summary {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding-top: 2px;
      list-style: none;
      cursor: pointer;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dim);
    }

    .ajustes summary::-webkit-details-marker { display: none; }
    .ajustes summary::after { content: "+"; margin-left: auto; color: var(--gold); font-size: 15px; letter-spacing: 0; }
    .ajustes[open] summary::after { content: "–"; }

    .ajustes-res {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: none;
      color: var(--faint);
    }

    .ajustes .opciones { margin-top: 2px; padding-top: 4px; border-top: none; }

    .hecho-msg {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      color: var(--gold);
    }
    .hecho-msg:empty { display: none; }

    /* ---------- los ejercicios ---------- */
    .lista { display: grid; gap: 12px; align-content: start; min-width: 0; }

    .bloque-cab { margin: 14px 2px 2px; }
    .bloque-cab:first-child { margin-top: 0; }

    .bloque-titulo {
      font-size: 10px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--hielo);
    }

    .bloque-nota { margin-top: 5px; font-size: 12.5px; color: var(--dim); }

    .ejercicios { list-style: none; display: grid; gap: 12px; }

    .ej {
      padding: 16px 16px 16px;
      transition: border-color 0.25s ease, opacity 0.25s ease;
    }

    .ej.ahora {
      border-color: rgba(227, 192, 122, 0.6);
      box-shadow: 0 0 0 1px rgba(227, 192, 122, 0.15), 0 0 40px rgba(227, 192, 122, 0.06);
    }

    .ej-cab { display: flex; align-items: flex-start; gap: 12px; }

    .ej-num {
      flex: none;
      width: 28px;
      padding-top: 3px;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--faint);
      font-variant-numeric: tabular-nums;
    }

    .ej.ahora .ej-num { color: var(--gold); }

    .ej-txt { flex: 1; min-width: 0; }

    .ej-tag {
      display: inline-block;
      margin-bottom: 6px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(227, 192, 122, 0.14);
      color: var(--gold);
      font-size: 9px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    .ej-nombre { font-size: 17px; font-weight: 400; line-height: 1.3; }

    .ej-det { margin-top: 4px; font-size: 13.5px; line-height: 1.45; color: var(--dim); }

    .ej-check {
      flex: none;
      appearance: none;
      width: var(--toque);
      height: var(--toque);
      margin: -4px -4px 0 0;
      border-radius: 50%;
      border: 1.5px solid rgba(245, 242, 234, 0.3);
      background: transparent;
      color: transparent;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
    }

    .ej-check:active { transform: scale(0.92); }
    .ej-check[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #0a0a0a; }

    /* hecho: se pliega a una línea para no estorbar; tocándolo se abre */
    .ej.ok { opacity: 0.62; padding-bottom: 14px; }
    .ej.ok.abierta { opacity: 1; }
    .ej.ok .ej-nombre { text-decoration: line-through; text-decoration-color: rgba(227, 192, 122, 0.55); }
    .ej.ok .ej-txt { cursor: pointer; }
    .ej.ok:not(.abierta) .ej-cuerpo { display: none; }
    .ej-plegado { margin-top: 4px; font-size: 12px; color: var(--gold); }
    .ej:not(.ok) .ej-plegado, .ej.abierta .ej-plegado { display: none; }

    .ej-cuerpo { margin-top: 14px; display: grid; gap: 12px; }

    /* series: un toque por serie terminada; arranca el descanso */
    .series { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .series-lbl {
      margin-right: 4px;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .serie {
      appearance: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1.5px solid rgba(245, 242, 234, 0.25);
      background: transparent;
      color: var(--dim);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
    }

    .serie:active { transform: scale(0.9); }
    .serie.hecha { background: rgba(227, 192, 122, 0.18); border-color: var(--gold); color: var(--gold); }
    .serie.siguiente { border-color: rgba(245, 242, 234, 0.6); color: var(--ink); }

    /* el peso: − [ 70 kg ] + guardar */
    .peso { display: flex; align-items: stretch; gap: 8px; max-width: 520px; }

    .paso {
      flex: none;
      appearance: none;
      width: var(--toque);
      min-height: var(--toque);
      border-radius: 14px;
      border: 1px solid var(--tarjeta-borde);
      background: rgba(255, 255, 255, 0.03);
      color: var(--ink);
      font-size: 22px;
      font-weight: 200;
      line-height: 1;
      cursor: pointer;
    }

    .paso:active { background: rgba(255, 255, 255, 0.09); }

    .peso-campo {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 12px;
      border: 1px solid rgba(245, 242, 234, 0.25);
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.35);
      cursor: text;
    }

    .peso-campo:focus-within { border-color: var(--gold); }

    .peso-campo input {
      flex: 1;
      min-width: 0;
      width: 100%;
      border: none;
      background: transparent;
      color: var(--ink);
      font-family: inherit;
      font-size: 20px;        /* 16 px o más: el iPhone no hace zoom al tocar */
      font-weight: 300;
      text-align: center;
      font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }

    .peso-campo input:focus { outline: none; }
    .peso-campo input::-webkit-outer-spin-button,
    .peso-campo input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .peso-campo input::placeholder { color: var(--faint); }
    .peso-campo span { font-size: 12px; letter-spacing: 0.1em; color: var(--faint); }

    .guardar {
      flex: none;
      appearance: none;
      min-height: var(--toque);
      padding: 0 16px;
      border-radius: 14px;
      border: 1px solid var(--gold);
      background: var(--gold);
      color: #0a0a0a;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .guardar:disabled { opacity: 0.5; }

    .peso-info { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--dim); }
    .peso-ult.err { color: var(--rojo); }
    .vez { font-size: 12px; color: var(--faint); }

    /* desplegables (progreso, rutina): que parezcan lo que son, un botón
       que abre algo. Caja con borde, icono, "Ver …", el dato y una flecha
       que gira al abrir. */
    .despliega > summary {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: var(--toque);
      padding: 8px 14px 8px 10px;
      border: 1px solid rgba(158, 201, 230, 0.32);
      border-radius: 14px;
      background: rgba(158, 201, 230, 0.07);
      list-style: none;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
    }

    .despliega > summary::-webkit-details-marker { display: none; }
    .despliega > summary:hover { background: rgba(158, 201, 230, 0.12); border-color: rgba(158, 201, 230, 0.5); }
    .despliega > summary:active { transform: scale(0.985); }
    .despliega[open] > summary {
      border-color: rgba(158, 201, 230, 0.5);
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
    }

    .desp-ico {
      flex: none;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: rgba(158, 201, 230, 0.14);
      color: var(--hielo);
    }

    .desp-ico svg { width: 16px; height: 16px; }

    .desp-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .desp-titulo { font-size: 14px; font-weight: 400; color: var(--hielo); }
    .desp-meta { font-size: 12px; color: var(--dim); }

    .desp-flecha {
      flex: none;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(158, 201, 230, 0.35);
      color: var(--hielo);
      transition: transform 0.25s ease;
    }

    .desp-flecha svg { width: 12px; height: 12px; }
    .despliega[open] .desp-flecha { transform: rotate(180deg); }

    /* lo de dentro, pegado al botón */
    .despliega > :not(summary) { padding-left: 4px; padding-right: 4px; }
    .hist-resumen { margin: 8px 0 4px; font-size: 12.5px; color: var(--dim); line-height: 1.5; }
    .hist svg { display: block; width: 100%; max-width: 380px; height: auto; margin: 8px 0; }
    .hist-lista { list-style: none; margin-top: 4px; font-size: 13px; }

    .hist-fila {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-top: 1px solid var(--linea);
    }

    .hist-fecha { flex: 0 0 62px; color: var(--dim); }
    .hist-val { flex: 1; }
    .hist-val small { color: var(--faint); margin-left: 4px; }
    .hist-dif { flex: 0 0 auto; font-size: 11px; }
    .hist-dif.sube { color: var(--gold); }
    .hist-dif.baja { color: var(--hielo); }
    .peso-ult.err:empty { display: none; }

    .hist-borrar {
      appearance: none;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      border: 1px solid rgba(245, 242, 234, 0.2);
      background: transparent;
      color: var(--dim);
      font-size: 12px;
    }

    .hist-borrar:hover { border-color: var(--rojo); color: var(--rojo); }

    /* rutina en vídeo, desplegable */
    .enlace {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 0.06em;
      text-decoration: none;
      border-bottom: 1px solid rgba(227, 192, 122, 0.4);
      justify-self: start;
    }

    .rut-lista { list-style: none; margin-top: 8px; }

    .rut-fila {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 7px 0;
      border-top: 1px solid var(--linea);
      font-size: 13px;
    }

    .rut-n { flex: 0 0 18px; text-align: right; font-size: 11px; color: var(--gold); }
    .rut-txt { flex: 1 1 auto; min-width: 0; }
    .rut-nombre { display: block; line-height: 1.35; }
    .rut-es { display: block; font-size: 12px; color: var(--dim); line-height: 1.4; }
    .rut-t { flex: 0 0 auto; font-size: 11.5px; color: var(--dim); }
    .rut-descanso { padding: 4px 0; }
    .rut-descanso .rut-txt, .rut-descanso .rut-t { font-size: 11px; color: var(--faint); letter-spacing: 0.08em; }
    .rut-descanso .rut-n { color: var(--faint); }

    .nota-dia {
      padding: 18px;
      border-radius: var(--radio);
      border: 1px dashed rgba(158, 201, 230, 0.3);
      font-size: 13.5px;
      line-height: 1.7;
      color: var(--dim);
      text-align: center;
    }

    .acciones { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; margin-top: 6px; }

    .btn {
      appearance: none;
      min-height: 50px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid rgba(245, 242, 234, 0.25);
      background: transparent;
      color: var(--ink);
      font-size: 10.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn.primario { border-color: var(--gold); color: var(--gold); }
    .btn:hover { background: rgba(245, 242, 234, 0.05); }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .pie {
      padding: 26px 0 8px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      text-transform: uppercase;
      color: var(--faint);
    }

    /* ---------- barra de abajo: siguiente ejercicio y descanso ---------- */
    .barra-entreno {
      position: fixed;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 40;
      width: min(560px, calc(100% - 20px));
      transform: translateX(-50%);
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 68px;
      padding: 10px 10px 10px 18px;
      border: 1px solid var(--tarjeta-borde);
      border-radius: 22px;
      background: rgba(14, 14, 16, 0.9);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
    }

    .barra-entreno[hidden] { display: none; }

    /* lo que queda de descanso, como una línea que se vacía */
    .barra-entreno .gasto {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 3px;
      width: 0;
      background: var(--gold);
      transition: width 0.25s linear;
    }

    .barra-txt { flex: 1; min-width: 0; }

    .barra-lbl {
      display: block;
      font-size: 9.5px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--faint);
    }

    .barra-val {
      display: block;
      margin-top: 3px;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .barra-entreno.descansando .barra-lbl { color: var(--gold); }
    .barra-entreno.descansando .barra-val {
      margin-top: 0;
      font-size: 30px;
      font-weight: 200;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
    }

    .barra-entreno.fin { border-color: var(--gold); animation: avisar 0.6s ease 3; }

    @keyframes avisar {
      50% { box-shadow: 0 0 0 4px rgba(227, 192, 122, 0.35), 0 18px 50px rgba(0, 0, 0, 0.6); }
    }

    .barra-btns { display: flex; gap: 6px; flex: none; }

    .chip {
      appearance: none;
      min-width: var(--toque);
      height: var(--toque);
      padding: 0 10px;
      border-radius: 14px;
      border: 1px solid var(--tarjeta-borde);
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
    }

    .chip:active { background: rgba(255, 255, 255, 0.1); }
    .chip.pref { border-color: rgba(227, 192, 122, 0.6); color: var(--gold); }
    .chip.fuerte { background: var(--gold); border-color: var(--gold); color: #0a0a0a; font-weight: 400; }

    /* avisos cortos, encima de la barra */
    .aviso {
      position: fixed;
      left: 50%;
      bottom: calc(92px + env(safe-area-inset-bottom, 0px));
      z-index: 41;
      max-width: calc(100% - 32px);

    .aviso.visible { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 380px) {

    }

    ];

    // ---------- semana y guardado ----------
    function pad(n) { return String(n).padStart(2, '0'); }

    function lunesDe(fecha) {
      var d = new Date(fecha.getFullYear(), fecha.getMonth(), fecha.getDate());
      var dow = (d.getDay() + 6) % 7;          // lunes = 0
      d.setDate(d.getDate() - dow);
      return d;
    }

    function claveSemana() {
      var l = lunesDe(new Date());
      return l.getFullYear() + '-' + pad(l.getMonth() + 1) + '-' + pad(l.getDate());
    }

    var KEY = 'entreno-' + claveSemana();

    function cargar() {
      try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
    }

    function guardar(est) {
      try { localStorage.setItem(KEY, JSON.stringify(est)); } catch (e) {}
    }

    var estado = cargar();
    var hoyIdx = (new Date().getDay() + 6) % 7;
    var activo = hoyIdx;

    function idsDe(d) {
      var ids = [];
      PLAN[d].bloques.forEach(function (b, bi) {
        b.ejercicios.forEach(function (e, ei) { ids.push(e.id || bi + '-' + ei); });
      });
      return ids;
    }

    function progreso(d) {
      var ids = idsDe(d), hechos = estado[d] || [];
      var n = ids.filter(function (id) { return hechos.indexOf(id) !== -1; }).length;
      return { n: n, total: ids.length, pct: ids.length ? Math.round(n / ids.length * 100) : 0 };
    }

    // ---------- base de datos (Supabase) ----------
    // Tablas: `pesos_entreno` y `ejercicios_hechos` (ver supabase-entreno-v2.sql).
    // Clave pública (anon / publishable) del proyecto. Sin clave, o sin conexión,
    // todo queda guardado en este navegador y se sube cuando vuelva la conexión.
    var SUPABASE_URL = 'https://vjnxxxeivtptkvczwexj.supabase.co';
    var SUPABASE_ANON_KEY = 'sb_publishable_dhlBvkmZaWZC29szeVxMeQ_abPtQwXg';
    var PEND_KEY = 'entreno-pendientes';
    var UNIDAD_KEY = 'entreno-unidad';
    var LB = 2.20462;

    function usaNube() { return !!(SUPABASE_URL && SUPABASE_ANON_KEY); }
    function cabeceras(extra) {
      return Object.assign({ apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY,
                             'Content-Type': 'application/json' }, extra || {});
    }
    function rest(ruta, opc) {
      opc = opc || {}; opc.headers = cabeceras(opc.headers);
      return fetch(SUPABASE_URL + '/rest/v1/' + ruta, opc).then(function (r) {
        if (!r.ok) { var e = new Error(r.status); e.status = r.status; throw e; }
        return r.status === 204 ? null : r.text().then(function (t) { return t ? JSON.parse(t) : null; });
      });
    }

    // ---- unidad (kg / lb), por dispositivo
    var unidad = 'kg';
    try { if (localStorage.getItem(UNIDAD_KEY) === 'lb') unidad = 'lb'; } catch (e) {}
    function redondear(v) { return Math.round(v * 10) / 10; }
    function aKg(v, u) { return u === 'lb' ? v / LB : v; }
    // el valor de un registro en la unidad elegida (si se anotó en ella, tal cual)
    function valorDe(r) { return r.unidad === unidad ? r.valor : redondear(unidad === 'lb' ? r.kg * LB : r.kg); }

    // ---- registros de peso: los de la nube + los pendientes de subir
    var nube = [];
    function normalizar(f) {
      return { id: f.id, dia: f.dia, ejercicio: f.ejercicio, kg: Number(f.kg),
               valor: f.valor != null ? Number(f.valor) : Number(f.kg), unidad: f.unidad || 'kg', fecha: f.created_at };
    }
    function leerPend() { try { return JSON.parse(localStorage.getItem(PEND_KEY)) || []; } catch (e) { return []; } }
    function escribirPend(l) { try { localStorage.setItem(PEND_KEY, JSON.stringify(l)); } catch (e) {} }
    function registrosDe(d, nombre) {
      var dia = PLAN[d].dia;
      return nube.concat(leerPend()).filter(function (r) { return r.dia === dia && r.ejercicio === nombre; })
        .sort(function (a, b) { return new Date(a.fecha) - new Date(b.fecha); });
    }

    function cuerpoPost(f, completo) {
      var o = { semana: f.semana, dia: f.dia, ejercicio: f.ejercicio, kg: f.kg, created_at: f.fecha };
      if (completo) { o.valor = f.valor; o.unidad = f.unidad; }
      return JSON.stringify(o);
    }
    // si aún no se ha ejecutado el SQL nuevo (columnas valor/unidad), reintenta sin ellas
    function subir(f) {
      var opc = function (completo) {
        return { method: 'POST', headers: { Prefer: 'return=representation' }, body: cuerpoPost(f, completo) };
      };
      return rest('pesos_entreno', opc(true)).catch(function (e) {
        if (e.status === 400) return rest('pesos_entreno', opc(false));
        throw e;
      }).then(function (filas) { return normalizar(filas[0]); });
    }

    var COLS = 'id,dia,ejercicio,kg,created_at';
    function cargarRegistros() {
      var q = '?order=created_at.desc&limit=3000&select=';
      return rest('pesos_entreno' + q + COLS + ',valor,unidad').catch(function (e) {
        if (e.status === 400) return rest('pesos_entreno' + q + COLS);
        throw e;
      }).then(function (filas) { nube = filas.map(normalizar); });
    }

    function subirPendientes() {
      var pend = leerPend();
      if (!pend.length) return Promise.resolve();
      return pend.reduce(function (p, f) {
        return p.then(function () {
          return subir(f).then(function (r) {
            escribirPend(leerPend().filter(function (x) { return x.id !== f.id; }));
            nube.push(r);
          }).catch(function () {});
        });
      }, Promise.resolve());
    }

    function guardarPeso(d, nombre, valor) {
      var fila = { id: 'p' + Date.now() + Math.random().toString(36).slice(2, 6), semana: claveSemana(),
                   dia: PLAN[d].dia, ejercicio: nombre, kg: Math.round(aKg(valor, unidad) * 100) / 100,
                   valor: valor, unidad: unidad, fecha: new Date().toISOString(), pendiente: true };
      var aPendiente = function () { escribirPend(leerPend().concat([fila])); return { pendiente: true }; };
      if (!usaNube()) return Promise.resolve(aPendiente());
      return subir(fila).then(function (r) { nube.push(r); return { pendiente: false }; })
        .catch(aPendiente);
    }

    function borrarRegistro(r) {
      if (r.pendiente) { escribirPend(leerPend().filter(function (x) { return x.id !== r.id; })); return Promise.resolve(); }
      return rest('pesos_entreno?id=eq.' + encodeURIComponent(r.id), { method: 'DELETE', headers: { Prefer: 'return=representation' } })
        .then(function (filas) {
          if (!filas || !filas.length) throw new Error('sin permiso');
          nube = nube.filter(function (x) { return x.id !== r.id; });
        });
    }

    // ---- ejercicios marcados y última vez que se marcó cada uno
    var ultimaVez = {};   // 'Día|Ejercicio' -> fecha ISO
    function listaEj(d) {
      var l = [];
      PLAN[d].bloques.forEach(function (b, bi) {
        b.ejercicios.forEach(function (e, ei) { l.push({ id: e.id || bi + '-' + ei, n: e.n }); });
      });
      return l;
    }
    function sincronizarHechos(d, items, on) {
      if (!items.length) return;
      var ahora = new Date().toISOString();
      var filas = items.map(function (x) {
        var f = { semana: claveSemana(), dia: PLAN[d].dia, ejercicio: x.n, hecho: on };
        if (on) { f.marcado_at = ahora; ultimaVez[PLAN[d].dia + '|' + x.n] = ahora; }
        return f;
      });
      if (!usaNube()) return;
      rest('ejercicios_hechos?on_conflict=semana,dia,ejercicio', {
        method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(filas)
      }).then(function () { if (!on) return cargarHechos(true).then(pintar); }).catch(function () {});
    }
    // soloUltima: refresca únicamente "última vez" (tras desmarcar), sin tocar lo marcado en pantalla
    function cargarHechos(soloUltima) {
      return rest('ejercicios_hechos?select=semana,dia,ejercicio,hecho,marcado_at&limit=5000').then(function (filas) {
        var semana = claveSemana(), marcados = {}, uv = {};
        filas.forEach(function (f) {
          var k = f.dia + '|' + f.ejercicio;
          if (f.hecho && (!uv[k] || f.marcado_at > uv[k])) uv[k] = f.marcado_at;
          if (f.hecho && f.semana === semana) marcados[k] = true;
        });
        ultimaVez = uv;
        if (soloUltima) return;
        estado = {};
        PLAN.forEach(function (p, d) {
          var ids = listaEj(d).filter(function (x) { return marcados[p.dia + '|' + x.n]; }).map(function (x) { return x.id; });
          if (ids.length) estado[d] = ids;
        });
        guardar(estado);
      });
    }

    function cargarTodo() {
      if (!usaNube()) { pintar(); alAbrir(); return; }
      cargarRegistros().then(subirPendientes).catch(function () {})
        .then(function () { return cargarHechos().catch(function () {}); })
        .then(function () { pintar(); alAbrir(); });
    }

    // ---- formato
    var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
    function fechaCorta(iso) { var f = new Date(iso); return f.getDate() + ' ' + MESES[f.getMonth()]; }
    function esHoy(iso) { return new Date(iso).toDateString() === new Date().toDateString(); }
    function textoUltimo(regs) {
      if (!regs.length) return 'Sin registro';
      var r = regs[regs.length - 1];
      return 'Último: ' + valorDe(r) + ' ' + unidad + ' · ' + fechaCorta(r.fecha);
    }


    // el <summary> de un desplegable con forma de botón: icono, título, dato y flecha
    var ICONOS = {
      grafica: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13h12"/><path d="M3 10l3.5-3.5 2.5 2.5L13 4.5"/><path d="M10 4.5h3v3"/></svg>',
      lista: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 4h8M6 8h8M6 12h8"/><circle cx="2.6" cy="4" r=".9" fill="currentColor" stroke="none"/><circle cx="2.6" cy="8" r=".9" fill="currentColor" stroke="none"/><circle cx="2.6" cy="12" r=".9" fill="currentColor" stroke="none"/></svg>'
    };
    var FLECHA = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5L6 8l3.5-3.5"/></svg>';

    function botonDespliega(icono, titulo, meta) {
      var sum = document.createElement('summary');
      var ico = document.createElement('span'); ico.className = 'desp-ico'; ico.innerHTML = ICONOS[icono];
      ico.setAttribute('aria-hidden', 'true');
      var txt = document.createElement('span'); txt.className = 'desp-txt';
      var t = document.createElement('span'); t.className = 'desp-titulo'; t.textContent = titulo;
      var m = document.createElement('span'); m.className = 'desp-meta'; m.textContent = meta;
      txt.appendChild(t); txt.appendChild(m);
      var fl = document.createElement('span'); fl.className = 'desp-flecha'; fl.innerHTML = FLECHA;
      fl.setAttribute('aria-hidden', 'true');
      sum.appendChild(ico); sum.appendChild(txt); sum.appendChild(fl);

      var min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
      if (min === max) { min -= 1; max += 1; }
      var ns = 'http://www.w3.org/2000/svg';
      var svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('role', 'img');
      svg.setAttribute('aria-label', 'Progreso de ' + pts[0] + ' a ' + pts[pts.length - 1] + ' ' + unidad);
      function el(n, a) { var e = document.createElementNS(ns, n); for (var k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
      function xy(i) { return [X + (W - X - 8) * (pts.length === 1 ? 0.5 : i / (pts.length - 1)), H - Y - (H - 2 * Y) * (pts[i] - min) / (max - min)]; }
      el('line', { x1: X, y1: Y, x2: W - 8, y2: Y, stroke: 'rgba(245,242,234,0.08)' });
      el('line', { x1: X, y1: H - Y, x2: W - 8, y2: H - Y, stroke: 'rgba(245,242,234,0.08)' });
      var t1 = el('text', { x: 0, y: Y + 3, fill: 'rgba(245,242,234,0.55)', 'font-size': 9 }); t1.textContent = redondear(max);
      var t2 = el('text', { x: 0, y: H - Y + 3, fill: 'rgba(245,242,234,0.55)', 'font-size': 9 }); t2.textContent = redondear(min);
      el('polyline', { points: pts.map(function (_, i) { return xy(i).join(','); }).join(' '),
                       fill: 'none', stroke: '#e3c07a', 'stroke-width': 1.8, 'stroke-linejoin': 'round' });
      pts.forEach(function (_, i) { var c = xy(i); el('circle', { cx: c[0], cy: c[1], r: 2.6, fill: '#e3c07a' }); });

          g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.16);

      var cont = el('div', 'peso-bloque');
      var k = PLAN[d].dia + '|' + nombre;
      var ultimo = regs.length ? valorDe(regs[regs.length - 1]) : null;
      var paso = unidad === 'lb' ? 5 : 2.5;

      var fila = el('div', 'peso');
      var menos = el('button', 'paso', '−'); menos.type = 'button';
      menos.setAttribute('aria-label', 'Restar ' + paso + ' ' + unidad);
      var mas = el('button', 'paso', '+'); mas.type = 'button';
      mas.setAttribute('aria-label', 'Sumar ' + paso + ' ' + unidad);

      var campo = el('label', 'peso-campo');
      var inp = el('input');
      inp.type = 'number'; inp.min = '0'; inp.step = 'any'; inp.inputMode = 'decimal';
      inp.placeholder = '0';
      inp.setAttribute('aria-label', 'Peso en ' + unidad + ' de ' + nombre);
      inp.value = borradores[k] != null ? borradores[k] : (ultimo != null ? ultimo : '');
      inp.addEventListener('input', function () { borradores[k] = inp.value; });
      campo.appendChild(inp);
      campo.appendChild(el('span', null, unidad));

      function mover(signo) {
        var v = parseFloat(String(inp.value).replace(',', '.'));
        if (!(v >= 0)) v = ultimo || 0;
        v = Math.max(0, redondear(v + signo * paso));
        inp.value = v; borradores[k] = String(v);
      }
      menos.addEventListener('click', function () { mover(-1); });
      mas.addEventListener('click', function () { mover(1); });

      var btn = el('button', 'guardar', 'Guardar'); btn.type = 'button';
      var info = el('div', 'peso-info');
      var ult = el('span', 'peso-ult', textoUltimo(regs));
      info.appendChild(ult);

      function enviar() {
        var v = parseFloat(String(inp.value).replace(',', '.'));
        if (!(v > 0 && v <= 2000)) { ult.className = 'peso-ult err'; ult.textContent = 'Escribe un peso válido'; return; }
        btn.disabled = true; ult.className = 'peso-ult'; ult.textContent = 'Guardando…';
        inp.blur();
        guardarPeso(d, nombre, v).then(function (res) {
          delete borradores[k];
          if (!estaHecho(d, id)) marcar(d, id, true); else pintar();
          mostrarAviso(res.pendiente ? 'Guardado en este móvil; se subirá con conexión' : 'Peso guardado · ' + v + ' ' + unidad);
        });
      }
      btn.addEventListener('click', enviar);
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); enviar(); } });

      fila.appendChild(menos); fila.appendChild(campo); fila.appendChild(mas); fila.appendChild(btn);
      cont.appendChild(fila);
      cont.appendChild(info);
      if (regs.length) {
        var h = pintarHistorial(d, nombre, regs, pintar);
        h.style.marginTop = '6px';
        cont.appendChild(h);
      }
      cont.style.display = 'grid';
      cont.style.gap = '8px';
      return cont;
    }

    // ---------- la barra de abajo ----------
    function pintarBarra() {
      var p = PLAN[activo];
      if (p.descanso && !descanso) { barraEl.hidden = true; return; }
      barraEl.hidden = false;
      barraBtns.innerHTML = '';

      if (descanso) {
        barraEl.classList.add('descansando');
        barraLbl.textContent = 'Descanso';
        actualizarCuenta();
        [['−15', -15], ['+15', 15]].forEach(function (x) {
          var b = el('button', 'chip', x[0]); b.type = 'button';
          b.setAttribute('aria-label', (x[1] > 0 ? 'Sumar' : 'Restar') + ' 15 segundos');
          b.addEventListener('click', function () { ajustarDescanso(x[1]); });
          barraBtns.appendChild(b);
        });
        var sal = el('button', 'chip fuerte', 'Listo'); sal.type = 'button';
        sal.setAttribute('aria-label', 'Terminar el descanso');
        sal.addEventListener('click', function () { terminarDescanso(false); });
        barraBtns.appendChild(sal);
        return;
      }

      barraEl.classList.remove('descansando');
      barraGasto.style.width = '0';
      var sig = siguiente(activo);
      barraLbl.textContent = sig ? (activo === hoyIdx ? 'Ahora' : 'Primero sin hacer') : 'Todo hecho';
      barraVal.textContent = sig ? sig.n : 'Día completado 🐧';
      OPCIONES_DESC.forEach(function (s) {
        var b = el('button', 'chip' + (s === descansoPref ? ' pref' : ''), s < 120 ? s + 's' : s / 60 + 'm');
        b.type = 'button';
        b.setAttribute('aria-label', 'Empezar descanso de ' + s + ' segundos');
        b.addEventListener('click', function () { iniciarDescanso(s); });
        barraBtns.appendChild(b);
      });
    }

    function actualizarCuenta() {
      if (!descanso) return;
      var queda = descanso.fin - Date.now();
      if (queda <= 0) { terminarDescanso(true); return; }
      barraVal.textContent = mmss(queda);
      barraGasto.style.width = (100 * (1 - queda / (descanso.total * 1000))) + '%';
    }

    setInterval(actualizarCuenta, 250);

    // una rutina en vídeo: se lee, no se marca ejercicio a ejercicio
    function pintarRutina(lista) {
      var ejercicios = lista.filter(function (r) { return !r.descanso; });
      var segundos = lista.reduce(function (acc, r) { return acc + (r.descanso || r.t || 0); }, 0);
      var min = Math.floor(segundos / 60), seg = segundos % 60;

      var det = document.createElement('details'); det.className = 'rutina despliega';
      det.appendChild(botonDespliega('lista', 'Ver la rutina exacta',
        ejercicios.length + ' ejercicios · ' + min + ' min' + (seg ? ' ' + seg + ' s' : '')));

      var ol = document.createElement('ol'); ol.className = 'rut-lista';
      var num = 0;
      lista.forEach(function (r) {
        var li = document.createElement('li');
        var a = document.createElement('span'); a.className = 'rut-n';
        var b = document.createElement('span'); b.className = 'rut-txt';
        var c = document.createElement('span'); c.className = 'rut-t';
        if (r.descanso) {
          li.className = 'rut-fila rut-descanso';
          a.textContent = '·';
          b.textContent = 'Descanso';
          c.textContent = r.descanso + ' s';
        } else {
          li.className = 'rut-fila';
          a.textContent = ++num;
          var n = document.createElement('span'); n.className = 'rut-nombre'; n.textContent = r.n;
          var es = document.createElement('span'); es.className = 'rut-es'; es.textContent = r.es;
          b.appendChild(n); b.appendChild(es);
          c.textContent = r.t + ' s';
        }
        li.appendChild(a); li.appendChild(b); li.appendChild(c);
        ol.appendChild(li);
      });
      det.appendChild(ol);

      // abrir o cerrar la lista no marca el ejercicio
      det.addEventListener('click', function (ev) { ev.stopPropagation(); });
      return det;
    }


    // quieto: no mover la pantalla (al deshacer una serie, por ejemplo)
    function marcar(d, id, on, quieto) {
      var arr = estado[d] || [];
      if (on && arr.indexOf(id) === -1) arr.push(id);
      if (!on) arr = arr.filter(function (x) { return x !== id; });
      estado[d] = arr;
      guardar(estado);
      sincronizarHechos(d, listaEj(d).filter(function (x) { return x.id === id; }), on);
      pintar();
      if (on && !quieto) llevarAlSiguiente();
    }

    // al terminar un ejercicio, el siguiente sube a la vista si no lo está
    function llevarAlSiguiente() {
      var s = diaEl.querySelector('.ej.ahora');
      if (!s) return;
      var r = s.getBoundingClientRect();
      if (r.top < 80 || r.bottom > window.innerHeight - 100) {
        var suave = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        s.scrollIntoView({ block: 'center', behavior: suave ? 'smooth' : 'auto' });
      }
    }

    // si hoy ya va empezado, abre la página en el ejercicio que toca
    function alAbrir() {
      if (activo !== hoyIdx || !progreso(activo).n || window.scrollY > 40) return;
      llevarAlSiguiente();
    }

    function pintar() { pintarSemana(); pintarResumen(); pintarDia(); pintarBarra(); }
    pintar();
    cargarTodo();
  </script>
</body>
